<body>

<div id="toolbar">
    <input type="file" id="fileInput" accept="video/*" style="display:none">
    <input type="file" id="jsonInput" accept=".json,application/json" style="display:none">

    <span id="filename-display">no file loaded</span>
    <div style="flex:1"></div>
    <span class="ctrl-label">FPS</span>
    <select id="fpsSelect">
        <option value="24" selected>24</option><option value="25">25</option>
        <option value="30">30</option><option value="50">50</option><option value="60">60</option>
    </select>
    <label><input type="checkbox" id="loopToggle"> LOOP</label>
    <button id="importBtn">LOAD MARKUP</button>
    <button id="exportVideoBtn" class="accent">EXPORT VIDEO</button>
    <button id="exportBtn" class="accent">SAVE MARKUP</button>
</div>

<div id="viewer-container">
    <video id="videoSource" preload="auto"></video>
    <canvas id="drawLayer" width="1280" height="720"></canvas>
    <div id="drop-overlay">DROP VIDEO FILE</div>
</div>

<div id="timeline-container">
    <div id="timeline-progress"></div>
    <div id="marker-layer"></div>
</div>

<div id="status-bar">
    <span id="frame-counter">– / –</span>
    <span id="annotation-nav"></span>
    <span id="status-hint">LOAD A VIDEO TO BEGIN</span>
</div>

<div id="controls">
    <div class="ctrl-group">
        <button id="prevFrameBtn">◀ FRAME</button>
        <button id="playPauseBtn">▶ PLAY</button>
        <button id="nextFrameBtn">FRAME ▶</button>
    </div>
    <div class="ctrl-group">
        <span class="ctrl-label">COLOR</span>
        <div id="color-swatches"></div>
        <input type="color" id="colorPicker" value="#ff3333" title="Custom color">
    </div>
    <div class="ctrl-group">
        <span class="ctrl-label">SIZE</span>
        <input type="number" id="penSize" value="5" min="1" max="100">
    </div>
    <div class="ctrl-group">
        <label><input type="checkbox" id="pressureToggle" checked> PRESSURE</label>
    </div>
    <div class="ctrl-group">
        <button id="undoBtn">UNDO</button>
        <button id="clearBtn">DELETE</button>
        <button id="exportFrameBtn">SAVE IMAGE</button>
    </div>
    <div class="ctrl-group"></div>
</div>

<div id="comment-bar">
    <input type="textarea" id="comment-input" placeholder="add a comment to this frame" maxlength="500">
    <button id="comment-save-btn" title="Save comment (Enter)">+</button>
    <button id="comment-clear-btn" title="Remove comment">✕</button>
</div>

<div id="shortcuts">
    <span><kbd>SPACE</kbd> Play/Pause</span>
    <span><kbd>D</kbd> / <kbd>A</kbd> Next/Prev frame</span>
    <span><kbd>→</kbd> / <kbd>←</kbd> Next/Prev annotation</span>
    <span><kbd>Z</kbd> Undo</span>
    <span><kbd>DEL</kbd> Delete frame</span>
    <span><kbd>CTRL</kbd>+<kbd>C</kbd> Copy annotations</span>
    <span><kbd>CTRL</kbd>+<kbd>V</kbd> Paste annotations</span>
    <span><kbd>SHIFT</kbd> + Draw → Eraser</span>
    <span>Drag a video onto player to load</span>
</div>

<script>
// ── Config ─────────────────────────────────────────────
let FPS = 24, FRAME_TIME = 1 / FPS;
const PRESET_COLORS = ['#ff3333','#ff8c00','#ffe033','#33ff7a','#33ccff','#ffffff'];

// ── Refs ────────────────────────────────────────────────
const video          = document.getElementById('videoSource');
const canvas         = document.getElementById('drawLayer');
const ctx            = canvas.getContext('2d', { alpha: true, desynchronized: true });
const timelineEl     = document.getElementById('timeline-container');
const timelineBar    = document.getElementById('timeline-progress');
const markerLayer    = document.getElementById('marker-layer');
const frameCounter   = document.getElementById('frame-counter');
const statusHint     = document.getElementById('status-hint');
const annotationNav  = document.getElementById('annotation-nav');
const penSizeInput   = document.getElementById('penSize');
const pressureToggle = document.getElementById('pressureToggle');
const colorPicker    = document.getElementById('colorPicker');
const swatchContainer= document.getElementById('color-swatches');
const fileInput      = document.getElementById('fileInput');
const jsonInput      = document.getElementById('jsonInput');
const viewerEl       = document.getElementById('viewer-container');
const filenameEl     = document.getElementById('filename-display');
const fpsSelect      = document.getElementById('fpsSelect');
const playPauseBtn   = document.getElementById('playPauseBtn');
const commentInput   = document.getElementById('comment-input');
const commentSaveBtn = document.getElementById('comment-save-btn');
const commentClearBtn= document.getElementById('comment-clear-btn');

// ── State ───────────────────────────────────────────────
const drawings = {}, offscreenCache = {}, comments = {};
let currentStroke = null, currentColor = '#ff3333', lastP = 0.5;
let totalFrames = 0, targetFrame = 1, lastRenderedFrame = -1;
let drawPending = false, rafId = null;
let copiedAnnotations = null;
let loadedFile = null;

ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Color swatches ──────────────────────────────────────
PRESET_COLORS.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (color === currentColor ? ' active' : '');
    sw.style.background = color;
    sw.addEventListener('click', () => {
        currentColor = color;
        document.querySelectorAll('.swatch').forEach((s, i) =>
            s.classList.toggle('active', PRESET_COLORS[i] === color));
    });
    swatchContainer.appendChild(sw);
});
colorPicker.addEventListener('input', e => {
    currentColor = e.target.value;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
});

// ── Stroke rendering ────────────────────────────────────
function renderStroke(c, s) {
    const pts = s.points;
    if (!pts.length) return;
    c.globalCompositeOperation = s.eraser ? 'destination-out' : 'source-over';
    c.lineCap = c.lineJoin = 'round';
    c.strokeStyle = c.fillStyle = s.color;

    if (pts.length === 1) {
        c.beginPath();
        c.arc(pts[0].x, pts[0].y, Math.max(1, pts[0].p * s.size * (s.eraser ? 2.5 : 0.5)), 0, Math.PI * 2);
        c.fill();
    } else {
        for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i], p2 = pts[i + 1];
            const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
            const pmx = i > 0 ? (pts[i-1].x + p1.x) / 2 : p1.x;
            const pmy = i > 0 ? (pts[i-1].y + p1.y) / 2 : p1.y;
            c.beginPath();
            c.lineWidth = p1.p * s.size * (s.eraser ? 5 : 1);
            c.moveTo(pmx, pmy);
            c.quadraticCurveTo(p1.x, p1.y, mx, my);
            c.stroke();
        }
    }
    c.globalCompositeOperation = 'source-over';
}

// ── Frame rendering ─────────────────────────────────────
function renderFrame() {
    const frame = getFrame();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (offscreenCache[frame]) ctx.drawImage(offscreenCache[frame], 0, 0);
    if (currentStroke?.points.length >= 2) renderStroke(ctx, currentStroke);
    lastRenderedFrame = frame;
}

function scheduleDraw() {
    if (!drawPending) {
        drawPending = true;
        requestAnimationFrame(() => { renderFrame(); drawPending = false; });
    }
}

function makeOffscreen() {
    const oc = new OffscreenCanvas(canvas.width, canvas.height);
    const c2 = oc.getContext('2d');
    c2.imageSmoothingEnabled = true; c2.imageSmoothingQuality = 'high';
    return oc;
}

function rebuildOffscreen(frame) {
    const strokes = drawings[frame];
    if (!strokes?.length) { delete offscreenCache[frame]; return; }
    offscreenCache[frame] = makeOffscreen();
    strokes.forEach(s => renderStroke(offscreenCache[frame].getContext('2d'), s));
}

// ── Frame utils ─────────────────────────────────────────
function getFrame() {
    if (video.paused || !totalFrames) return targetFrame;
    targetFrame = Math.max(1, Math.min(Math.floor(video.currentTime * FPS) + 1, totalFrames));
    return targetFrame;
}

function goToFrame(frame) {
    // Persist any typed-but-unsaved comment before leaving the current frame
    if (!commentInput.classList.contains('is-saved') && commentInput.value.trim().length > 0) {
        saveComment();
    }
    targetFrame = Math.max(1, Math.min(Math.round(frame), totalFrames || 1));
    video.currentTime = (targetFrame - 0.5) / FPS;
    updateCommentUI();
}

function frameToPercent(f) {
    return totalFrames <= 1 ? 0 : ((f - 1) / (totalFrames - 1)) * 100;
}

function updateUI() {
    const f = getFrame();
    timelineBar.style.width = `${frameToPercent(f)}%`;
    frameCounter.textContent = `${f} / ${totalFrames}`;
    if (f !== lastRenderedFrame) renderFrame();
    updateAnnotationNav(f);
}

function updateMarkers() {
    markerLayer.innerHTML = '';
    // Collect all frames with drawings or comments
    const allFrames = new Set([
        ...Object.keys(drawings).map(Number),
        ...Object.keys(comments).map(Number)
    ]);
    allFrames.forEach(f => {
        const hasDrawing = drawings[f]?.length > 0;
        const hasComment = comments[f] && comments[f].trim().length > 0;
        if (!hasDrawing && !hasComment) return;
        const el = document.createElement('div');
        el.className = 'frame-marker' + (hasDrawing ? '' : ' comment-only');
        el.style.left = `${frameToPercent(f)}%`;
        markerLayer.appendChild(el);
    });
}

// ── Annotation navigation ───────────────────────────────
function getAnnotatedFrames() {
    const allFrames = new Set([
        ...Object.keys(drawings).filter(k => drawings[k]?.length > 0).map(Number),
        ...Object.keys(comments).filter(k => comments[k]?.trim().length > 0).map(Number)
    ]);
    return [...allFrames].sort((a, b) => a - b);
}

function goToNextAnnotation() {
    const frames = getAnnotatedFrames();
    const next = frames.find(f => f > targetFrame);
    if (next != null) { goToFrame(next); updateUI(); }
}

function goToPrevAnnotation() {
    const frames = getAnnotatedFrames();
    const prev = [...frames].reverse().find(f => f < targetFrame);
    if (prev != null) { goToFrame(prev); updateUI(); }
}

function updateAnnotationNav(f) {
    const frames = getAnnotatedFrames();
    if (!frames.length) { annotationNav.textContent = ''; return; }
    const idx = frames.indexOf(f);
    if (idx >= 0) {
        annotationNav.innerHTML = `ANNOTATION <span>${idx + 1} / ${frames.length}</span>`;
    } else {
        annotationNav.innerHTML = `<span>${frames.length}</span> ANNOTATION${frames.length !== 1 ? 'S' : ''}`;
    }
}

// ── Comment UI ──────────────────────────────────────────
function updateCommentUI() {
    const f = targetFrame;
    const text = comments[f] || '';
    commentInput.value = text;
    const saved = text.length > 0;
    commentInput.classList.toggle('is-saved', saved);
    commentSaveBtn.classList.toggle('saved', saved);
}

function saveComment() {
    const f = targetFrame;
    const text = commentInput.value.trim();
    if (text.length > 0) {
        comments[f] = text;
    } else {
        delete comments[f];
    }
    commentInput.value = text;
    const saved = text.length > 0;
    commentInput.classList.toggle('is-saved', saved);
    commentSaveBtn.classList.toggle('saved', saved);
    updateMarkers();
    updateAnnotationNav(f);
}

function clearComment() {
    const f = targetFrame;
    delete comments[f];
    commentInput.value = '';
    commentInput.classList.remove('is-saved');
    commentSaveBtn.classList.remove('saved');
    updateMarkers();
    updateAnnotationNav(f);
}

// Strip saved styling as soon as the user starts editing
commentInput.addEventListener('input', () => {
    commentInput.classList.remove('is-saved');
    commentSaveBtn.classList.remove('saved');
});

// Auto-save when leaving the input
commentInput.addEventListener('blur', saveComment);

commentSaveBtn.addEventListener('click', saveComment);
commentClearBtn.addEventListener('click', clearComment);
commentInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveComment(); }
});

// ── Drawing ─────────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const isEraser = e.shiftKey || e.pointerType === 'eraser';
    const rawP = e.pressure > 0 ? e.pressure : 0.6;
    lastP = pressureToggle.checked ? Math.min(1.4, 0.4 + rawP) : 1.0;
    currentStroke = { frame: getFrame(), eraser: isEraser, size: parseInt(penSizeInput.value),
        color: isEraser ? 'rgba(0,0,0,1)' : currentColor, points: [] };
    addPoint(e);
    scheduleDraw();
});

canvas.addEventListener('pointermove', e => {
    if (!currentStroke) return;
    (e.getCoalescedEvents?.() ?? [e]).forEach(addPoint);
    scheduleDraw();
}, { passive: true });

canvas.addEventListener('pointerup',     () => currentStroke && commitStroke());
canvas.addEventListener('pointercancel', () => { currentStroke = null; renderFrame(); });

function addPoint(e) {
    const on = pressureToggle.checked;
    const raw = e.pressure > 0 ? e.pressure : 0.05;
    const smoothed = on ? ((0.4 + raw) * 0.8 + lastP * 0.2) : 1.0;
    const p = on ? Math.max(smoothed, lastP * 0.85) : 1.0;

    const prev = currentStroke.points.at(-1);
    if (prev) {
        const dx = e.offsetX - prev.x, dy = e.offsetY - prev.y;
        if (dx * dx + dy * dy < 2.25) return;
    }
    currentStroke.points.push({ x: e.offsetX, y: e.offsetY, p });
    lastP = p;
}

function commitStroke() {
    const { frame } = currentStroke;
    if (!drawings[frame]) drawings[frame] = [];
    if (currentStroke.points.length) {
        if (!offscreenCache[frame]) offscreenCache[frame] = makeOffscreen();
        renderStroke(offscreenCache[frame].getContext('2d'), currentStroke);
        drawings[frame].push(currentStroke);
        updateMarkers();
        updateAnnotationNav(getFrame());
    }
    currentStroke = null;
    renderFrame();
}

// ── Playback ────────────────────────────────────────────
function playbackLoop() {
    updateUI();
    if (!video.paused && !video.ended) rafId = requestAnimationFrame(playbackLoop);
}

const syncPlayPause = () => playPauseBtn.textContent = video.paused ? '▶ PLAY' : '⏸ PAUSE';
video.addEventListener('play',  () => { rafId = requestAnimationFrame(playbackLoop); syncPlayPause(); });
video.addEventListener('pause', () => { cancelAnimationFrame(rafId); if (!video.ended) goToFrame(targetFrame); updateUI(); syncPlayPause(); });
video.addEventListener('ended', () => { cancelAnimationFrame(rafId); updateUI(); syncPlayPause(); });
video.addEventListener('seeked', () => { if (video.paused) updateUI(); });
video.addEventListener('loadedmetadata', () => {
    totalFrames = Math.max(1, Math.round(video.duration * FPS));
    targetFrame = 1;
    statusHint.textContent = `${totalFrames} FRAMES · ${video.duration.toFixed(2)}s`;
    updateUI(); updateMarkers(); updateCommentUI();
});

// ── Timeline scrubbing ──────────────────────────────────
let scrubbingTimeline = false, lastScrubbedFrame = -1;

function scrubTimeline(e) {
    const pos = Math.max(0, Math.min(1, (e.clientX - timelineEl.getBoundingClientRect().left) / timelineEl.offsetWidth));
    const target = Math.max(1, Math.min(totalFrames, Math.round(pos * (totalFrames - 1)) + 1));
    if (target === lastScrubbedFrame) return;
    lastScrubbedFrame = target;
    goToFrame(target);
    timelineBar.style.width = `${frameToPercent(target)}%`;
    frameCounter.textContent = `${target} / ${totalFrames}`;
    renderFrame();
}

timelineEl.addEventListener('mousedown', e => { scrubbingTimeline = true; lastScrubbedFrame = -1; scrubTimeline(e); });
window.addEventListener('mousemove', e => { if (scrubbingTimeline) scrubTimeline(e); });
window.addEventListener('mouseup', () => { scrubbingTimeline = false; });

// ── Keyboard ────────────────────────────────────────────
window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')       { e.preventDefault(); video.paused ? video.play() : video.pause(); }
    if (e.code === 'KeyD')        { goToFrame(targetFrame + 1); updateUI(); }
    if (e.code === 'KeyA')        { goToFrame(targetFrame - 1); updateUI(); }
    if (e.code === 'ArrowRight')  { e.preventDefault(); goToNextAnnotation(); }
    if (e.code === 'ArrowLeft')   { e.preventDefault(); goToPrevAnnotation(); }
    if (e.code === 'KeyZ' && !e.ctrlKey) doUndo();
    if (e.code === 'Delete')      doClear();
    if (e.ctrlKey && e.code === 'KeyC') { e.preventDefault(); doCopyAnnotations(); }
    if (e.ctrlKey && e.code === 'KeyV') { e.preventDefault(); doPasteAnnotations(); }
});

// ── Undo / Clear ────────────────────────────────────────
function doUndo() {
    const f = getFrame();
    if (drawings[f]?.length) { drawings[f].pop(); rebuildOffscreen(f); updateMarkers(); renderFrame(); updateAnnotationNav(f); }
}
function doClear() {
    const f = getFrame();
    drawings[f] = []; delete offscreenCache[f]; updateMarkers(); renderFrame(); updateAnnotationNav(f);
}

function doCopyAnnotations() {
    const f = getFrame();
    const strokes = drawings[f];
    const comment = comments[f] || '';
    if (strokes?.length || comment) {
        copiedAnnotations = {
            strokes: (strokes || []).map(s => ({ ...s, points: s.points.map(p => ({ ...p })) })),
            comment
        };
        const parts = [];
        if (copiedAnnotations.strokes.length) parts.push(`${copiedAnnotations.strokes.length} STROKE${copiedAnnotations.strokes.length !== 1 ? 'S' : ''}`);
        if (comment) parts.push('COMMENT');
        statusHint.textContent = `COPIED ${parts.join(' + ')} FROM FRAME ${f}`;
    }
}

function doPasteAnnotations() {
    if (!copiedAnnotations) return;
    const f = getFrame();
    if (copiedAnnotations.strokes.length) {
        if (!drawings[f]) drawings[f] = [];
        const pasted = copiedAnnotations.strokes.map(s => ({ ...s, frame: f, points: s.points.map(p => ({ ...p })) }));
        drawings[f].push(...pasted);
        rebuildOffscreen(f);
    }
    if (copiedAnnotations.comment) {
        comments[f] = copiedAnnotations.comment;
        updateCommentUI();
    }
    updateMarkers();
    renderFrame();
    updateAnnotationNav(f);
    const parts = [];
    if (copiedAnnotations.strokes.length) parts.push(`${copiedAnnotations.strokes.length} STROKE${copiedAnnotations.strokes.length !== 1 ? 'S' : ''}`);
    if (copiedAnnotations.comment) parts.push('COMMENT');
    statusHint.textContent = `PASTED ${parts.join(' + ')} ONTO FRAME ${f}`;
}

document.getElementById('undoBtn').addEventListener('click', doUndo);
document.getElementById('clearBtn').addEventListener('click', doClear);
playPauseBtn.addEventListener('click', () => video.paused ? video.play() : video.pause());
document.getElementById('prevFrameBtn').addEventListener('click', () => { goToFrame(targetFrame - 1); updateUI(); });
document.getElementById('nextFrameBtn').addEventListener('click', () => { goToFrame(targetFrame + 1); updateUI(); });
document.getElementById('loopToggle').addEventListener('change', e => { video.loop = e.target.checked; });
fpsSelect.addEventListener('change', () => {
    FPS = parseInt(fpsSelect.value); FRAME_TIME = 1 / FPS;
    if (video.duration) {
        totalFrames = Math.max(1, Math.round(video.duration * FPS));
        statusHint.textContent = `${totalFrames} FRAMES · ${video.duration.toFixed(2)}s`;
        updateUI(); updateMarkers();
    }
});

// ── File loading ────────────────────────────────────────
document.getElementById('loadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideoFile(e.target.files[0]); fileInput.value = ''; });
viewerEl.addEventListener('dragover', e => { e.preventDefault(); viewerEl.classList.add('drag-over'); });
viewerEl.addEventListener('dragleave', () => viewerEl.classList.remove('drag-over'));
viewerEl.addEventListener('drop', e => {
    e.preventDefault(); viewerEl.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f?.type.startsWith('video/')) loadVideoFile(f);
});

function loadVideoFile(file) {
    loadedFile = file;
    if (video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(file);
    filenameEl.textContent = file.name;
    statusHint.textContent = 'LOADING…';
    [drawings, offscreenCache, comments].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    currentStroke = null; totalFrames = 0; lastRenderedFrame = -1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    markerLayer.innerHTML = ''; timelineBar.style.width = '0%'; frameCounter.textContent = '– / –';
    annotationNav.textContent = '';
    commentInput.value = ''; commentInput.classList.remove('is-saved'); commentSaveBtn.classList.remove('saved');
    video.load();
}

// ── JSON import ─────────────────────────────────────────
document.getElementById('importBtn').addEventListener('click', () => jsonInput.click());
jsonInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return; jsonInput.value = '';
    const reader = new FileReader();
    reader.onload = ev => {
        try { applyImport(JSON.parse(ev.target.result)); }
        catch { alert('Could not parse JSON file.'); }
    };
    reader.readAsText(file);
});

function applyImport(payload) {
    if (!payload.frames || typeof payload.frames !== 'object')
        return alert('Not a valid video-markup export.');
    if (payload.fps && [24,25,30,50,60].includes(payload.fps)) {
        FPS = payload.fps; FRAME_TIME = 1 / FPS; fpsSelect.value = String(FPS);
        if (video.duration) totalFrames = Math.max(1, Math.round(video.duration * FPS));
    }
    [drawings, offscreenCache, comments].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    Object.entries(payload.frames).forEach(([key, strokes]) => {
        const frame = parseInt(key);
        drawings[frame] = strokes.map(s => ({
            frame, color: s.color || '#ff3333', size: s.size || 3, eraser: s.eraser || false,
            points: (s.points || []).map(pt => Array.isArray(pt) ? { x: pt[0], y: pt[1], p: pt[2] } : pt)
        }));
        rebuildOffscreen(frame);
    });
    if (payload.comments && typeof payload.comments === 'object') {
        Object.entries(payload.comments).forEach(([key, text]) => {
            if (text && text.trim().length > 0) comments[parseInt(key)] = text;
        });
    }
    updateMarkers(); renderFrame(); updateCommentUI();
    const nFrames = Object.keys(payload.frames).length;
    const nComments = Object.keys(comments).length;
    statusHint.textContent = `IMPORTED ${nFrames} FRAME${nFrames !== 1 ? 'S' : ''}${nComments ? ` · ${nComments} COMMENT${nComments !== 1 ? 'S' : ''}` : ''} · ${payload.file || ''}`;
    updateAnnotationNav(targetFrame);
}

// ── Frame export (PNG) ──────────────────────────────────
document.getElementById('exportFrameBtn').addEventListener('click', () => {
    if (!totalFrames) return;
    const composite = new OffscreenCanvas(canvas.width, canvas.height);
    const c = composite.getContext('2d');
    // Draw video frame
    c.drawImage(video, 0, 0, canvas.width, canvas.height);
    // Draw annotation layer on top
    c.drawImage(canvas, 0, 0);
    // Draw the comments
    const text = comments[targetFrame];
    const lines = splitText(text);
    c.font = "15px Droid Sans Mono";
    c.fillStyle = "#000000AA";
    const boxHeight = (lines.length*20) + 10;
    c.fillRect(0, 0, 1280, boxHeight);
    c.fillStyle = "#FFFFFF";
    for (let i = 0; i < lines.length; i++) {
        c.fillText(lines[i], 10, 20 * (i + 1));
    }

    composite.convertToBlob({ type: 'image/png' }).then(blob => {
        const framePad = String(targetFrame).padStart(String(totalFrames).length, '0');
        const base = filenameEl.textContent.replace(/\.[^.]+$/, '') || 'frame';
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(blob),
            download: `${base}_f${framePad}.png`
        });
        a.click(); URL.revokeObjectURL(a.href);
    });
});

function splitText(text) {
    const limit = 140;
    const words = text.split(' ');
    const lines = [];
    let line = '';

    for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (test.length > limit && line) {
            lines.push(line);
            line = word;
        } else {
            line = test;
        }
    }
    if (line) lines.push(line);
    return lines;
}


function drawTextBox(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let currentY = y;

    for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, currentY);
            line = word;
            currentY += lineHeight;
        } else {
            line = test;
        }
    }
    ctx.fillText(line, x, currentY); // last line
}


// ── VIDEO export (MP4) ──────────────────────────────────
function seekToFrame(f) {
    return new Promise(resolve => {
        video.currentTime = (f - 0.5) / FPS;
        video.addEventListener('seeked', resolve, { once: true });
    });
}

document.getElementById('exportVideoBtn').addEventListener('click', async () => {
    if (!loadedFile || !totalFrames) return;

    const prevHint = statusHint.textContent;
    const exportBtn = document.getElementById('exportVideoBtn');
    exportBtn.disabled = true;
    exportBtn.textContent = 'EXPORTING…';

    try {
        const { Muxer, ArrayBufferTarget } = Mp4Muxer;

        const width = canvas.width, height = canvas.height;

        // ── Attempt audio decode ─────────────────────────
        const hasAudioEncoder = typeof AudioEncoder !== 'undefined';
        let audioBuffer = null, audioCtx = null;

        if (hasAudioEncoder) {
            try {
                audioCtx = new AudioContext();
                const fileBuffer = await loadedFile.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(fileBuffer);
            } catch {
                // Source has no audio track or decode failed — proceed video-only
                audioBuffer = null;
                audioCtx?.close();
                audioCtx = null;
            }
        }

        const withAudio = hasAudioEncoder && audioBuffer !== null;
        const sampleRate = audioBuffer?.sampleRate ?? 48000;
        const numberOfChannels = audioBuffer?.numberOfChannels ?? 2;

        // ── Set up muxer ─────────────────────────────────
        const target = new ArrayBufferTarget();
        const muxer = new Muxer({
            target,
            video: { codec: 'avc', width, height },
            ...(withAudio && { audio: { codec: 'aac', sampleRate, numberOfChannels } }),
            fastStart: 'in-memory'
        });

        // ── Audio encoder (if available) ──────────────────
        let audioEncoder = null;
        if (withAudio) {
            audioEncoder = new AudioEncoder({
                output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
                error: e => console.error('AudioEncoder error:', e)
            });
            audioEncoder.configure({ codec: 'mp4a.40.2', sampleRate, numberOfChannels, bitrate: 128_000 });

            const frameSize = 1024;
            for (let i = 0; i < audioBuffer.length; i += frameSize) {
                const len = Math.min(frameSize, audioBuffer.length - i);
                const timestamp = (i / sampleRate) * 1_000_000;
                const planar = new Float32Array(len * numberOfChannels);
                for (let ch = 0; ch < numberOfChannels; ch++) {
                    planar.set(audioBuffer.getChannelData(ch).subarray(i, i + len), ch * len);
                }
                const audioData = new AudioData({ format: 'f32-planar', sampleRate, numberOfFrames: len, numberOfChannels, timestamp, data: planar });
                audioEncoder.encode(audioData);
                audioData.close();
            }
        }

        // ── Video encoder ─────────────────────────────────
        const videoEncoder = new VideoEncoder({
            output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
            error: e => console.error('VideoEncoder error:', e)
        });
        videoEncoder.configure({ codec: 'avc1.42001f', width, height, framerate: FPS, bitrate: 8_000_000 });

        const composite = new OffscreenCanvas(width, height);
        const c = composite.getContext('2d');

        for (let f = 1; f <= totalFrames; f++) {
            await seekToFrame(f);
            c.clearRect(0, 0, width, height);
            c.drawImage(video, 0, 0, width, height);

            // Draw this frame's annotation directly from cache, not the live canvas
            if (offscreenCache[f]) c.drawImage(offscreenCache[f], 0, 0);

            // Draw comment if present
            const text = comments[f];
            if (text) {
                const lines = splitText(text);
                c.font = '15px Droid Sans Mono';
                c.fillStyle = '#000000AA';
                c.fillRect(0, 0, width, lines.length * 22 + 10);
                c.fillStyle = '#FFFFFF';
                for (let i = 0; i < lines.length; i++) {
                    c.fillText(lines[i], 10, 20 + i * 22);
                }
            }

            const timestamp = ((f - 1) / FPS) * 1_000_000;
            const videoFrame = new VideoFrame(composite, { timestamp });
            videoEncoder.encode(videoFrame, { keyFrame: f % 60 === 1 });
            videoFrame.close();
            statusHint.textContent = `EXPORTING… ${f} / ${totalFrames}${withAudio ? '' : ' · NO AUDIO'}`;
        }

        // ── Flush and finalize ────────────────────────────
        const flushJobs = [videoEncoder.flush()];
        if (audioEncoder) flushJobs.push(audioEncoder.flush());
        await Promise.all(flushJobs);
        videoEncoder.close();
        audioEncoder?.close();
        audioCtx?.close();
        muxer.finalize();

        // ── Download ──────────────────────────────────────
        const blob = new Blob([target.buffer], { type: 'video/mp4' });
        const base = filenameEl.textContent.replace(/\.[^.]+$/, '') || 'markup';
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(blob),
            download: `${base}_markup.mp4`
        });
        a.click();
        URL.revokeObjectURL(a.href);
        statusHint.textContent = `EXPORT COMPLETE${withAudio ? '' : ' · NO AUDIO TRACK'}`;

    } catch (err) {
        console.error('Export failed:', err);
        statusHint.textContent = 'EXPORT FAILED — see console';
    } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = 'EXPORT VIDEO';
    }
});

// ── JSON export ─────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
    const frames = {};
    Object.entries(drawings).forEach(([key, strokes]) => {
        const s = strokes.filter(s => s.points.length);
        if (!s.length) return;
        frames[key] = s.map(s => ({
            color: s.color, size: s.size, ...(s.eraser && { eraser: true }),
            points: s.points.map(p => [Math.round(p.x*10)/10, Math.round(p.y*10)/10, Math.round(p.p*100)/100])
        }));
    });
    const exportedComments = {};
    Object.entries(comments).forEach(([k, v]) => { if (v?.trim().length) exportedComments[k] = v.trim(); });
    const payload = { tool: 'video-markup', fps: FPS, totalFrames,
        canvasWidth: canvas.width, canvasHeight: canvas.height,
        exportedAt: new Date().toISOString(), file: filenameEl.textContent,
        frames, comments: exportedComments };
    const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })),
        download: `${filenameEl.textContent.replace(/\.[^.]+$/, '') || 'markup'}_markup.json`
    });
    a.click(); URL.revokeObjectURL(a.href);
});





</script>
